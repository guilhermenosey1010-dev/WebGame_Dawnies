
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de producto | GAME</title>
    <link rel="stylesheet" href="css/alta.css">
</head>
<body class="pagina-alta">
    <header>
        <div class="navegacion contenedor">
            <a class="marca" href="index.html" aria-label="GAME, inicio">GAME</a>
            <input id="buscar" type="search" placeholder="Buscar productos..." aria-label="Buscar productos">
            <span class="cuenta">Mi cuenta</span>
            <span class="cesta">Cesta (0)</span>
        </div>

        <nav class="barraNav" aria-label="Navegación principal">
            <div class="contenedor">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <span aria-disabled="true" title="Próximamente">Inventario</span>
                <a href="alta.html" class="activa" aria-current="page">Alta de producto</a>
            </div>
        </nav>
    </header>

    <main class="contenedor contenido-alta">
        <section aria-labelledby="titulo-alta">
            <h1 id="titulo-alta">Alta de producto</h1>
            <p class="descripcion-alta">Añade un producto a tu inventario.</p>

            <form class="formulario-alta" action="#" method="post"
                  enctype="multipart/form-data">

                <div class="campos-alta">
                    <div class="campo-alta">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre"
                               placeholder="Nombre del producto" value="Nova Quest"
                               required autofocus>
                    </div>

                    <div class="campo-alta">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria" required>
                            <option value="videojuegos" selected>Videojuegos</option>
                            <option value="consolas">Consolas</option>
                            <option value="accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="campo-alta">
                        <label for="plataforma">Plataforma</label>
                        <select id="plataforma" name="plataforma" required>
                            <option value="ps5" selected>PlayStation 5</option>
                            <option value="ps4">PlayStation 4</option>
                            <option value="xbox">Xbox</option>
                            <option value="switch">Nintendo Switch</option>
                            <option value="pc">PC</option>
                        </select>
                    </div>

                    <div class="campo-alta">
                        <label for="precio">Precio (€)</label>
                        <input type="number" id="precio" name="precio"
                               min="0" step="0.01" placeholder="59,99"
                               value="59.99" required>
                    </div>

                    <div class="campo-alta">
                        <label for="unidades">Unidades</label>
                        <input type="number" id="unidades" name="unidades"
                               min="0" step="1" value="12" required>
                    </div>

                    <div class="campo-alta">
                        <label for="imagen">Imagen</label>
                        <input type="file" id="imagen" name="imagen"
                               accept="image/*">
                    </div>
                </div>

                <div class="acciones-alta">
                    <button type="submit" class="guardar-producto">
                        Guardar producto
                    </button>

                    <a href="index.html" class="cancelar-producto">
                        Cancelar
                    </a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <div class="pie contenedor">
            <a class="marca" href="index.html">GAME</a>

            <div class="informacion">
                <span>Ayuda</span>
                <span>Contacto</span>
                <span>Envíos</span>
                <span>Privacidad</span>
            </div>

            <small>© GAME 2026</small>
        </div>
    </footer>
</body>
</html>
